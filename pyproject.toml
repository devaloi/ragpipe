[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragpipe"
version = "0.1.0"
description = "A RAG (Retrieval-Augmented Generation) pipeline with embeddings, ChromaDB, and retrieval chain"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "devaloi" }]
dependencies = [
    "chromadb>=1.0.0",
    "click>=8.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.11",
]

[project.scripts]
ragpipe = "ragpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
